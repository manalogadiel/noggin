<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="woodTop" x1="20" y1="26" x2="108" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d89248"/>
      <stop offset="55%" stop-color="#b9702c"/>
      <stop offset="100%" stop-color="#91511b"/>
    </linearGradient>
    <linearGradient id="woodBot" x1="22" y1="64" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c37934"/>
      <stop offset="100%" stop-color="#874815"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="20" y1="24" x2="108" y2="108" gradientUnits="userSpaceOnUse">
