<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <radialGradient id="tc-aura" cx="50%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#fff4a8" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-bulb" x1="36" y1="12" x2="60" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff7b8"/>
      <stop offset="52%" stop-color="#ffd94e"/>
      <stop offset="100%" stop-color="#eda416"/>
    </linearGradient>
    <linearGradient id="tc-book-l" x1="14" y1="50" x2="48" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#efe2c0"/>
    </linearGradient>
    <linearGradient id="tc-book-r" x1="48" y1="50" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#e8d6ae"/>
    </linearGradient>
    <linearGradient id="tc-cover" x1="12" y1="62" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#699c2a"/>
      <stop offset="100%" stop-color="#3e6b12"/>
    </linearGradient>
    <linearGradient id="tc-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8e878"/>
      <stop offset="100%" stop-color="#6fa32c"/>
    </linearGradient>
    <filter id="tc-sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#203b07" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Warm glowing halo behind lightbulb -->
  <circle cx="48" cy="30" r="28" fill="url(#tc-aura)"/>

  <g filter="url(#tc-sh)">
    <!-- Open hardcover base -->
    <path d="M12 61c0-3 2.5-5 5.5-5h61c3 0 5.5 2 5.5 5v15c0 3.5-2.8 6-6.2 6H53l-5 3.5L43 82H18.2C14.8 82 12 79.5 12 76V61z" fill="url(#tc-cover)"/>
    <!-- Left cream page -->
    <path d="M16 54c8-3.5 21-2.5 32 3.5v20.5c-10-4.5-22-5-32-2V54z" fill="url(#tc-book-l)"/>
    <!-- Right cream page -->
    <path d="M80 54c-8-3.5-21-2.5-32 3.5v20.5c10-4.5 22-5 32-2V54z" fill="url(#tc-book-r)"/>
    <!-- Center fold & soft page lines -->
    <path d="M48 57.5V78" stroke="#d9c396" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 61c6-1.2 13-.8 20 1.4M22 67.5c6-1.2 13-.8 20 1.4M74 61c-6-1.2-13-.8-20 1.4M74 67.5c-6-1.2-13-.8-20 1.4" stroke="#dac59b" stroke-width="2" stroke-linecap="round"/>
    <!-- Coral bookmark -->
    <path d="M58 76h8v12l-4-3.2L58 88V76z" fill="#f07268"/>

    <!-- Glowing 3D clay lightbulb -->
    <path d="M48 13c-10.2 0-17.5 7.4-17.5 16.5 0 6 3 10.6 7.4 13.7 1.4 1 2.2 2.5 2.4 4.2h15.4c.2-1.7 1-3.2 2.4-4.2 4.4-3.1 7.4-7.7 7.4-13.7C65.5 20.4 58.2 13 48 13z" fill="url(#tc-bulb)"/>
    <!-- Glossy clay specular highlight on bulb -->
    <ellipse cx="41" cy="23" rx="5.2" ry="3.2" transform="rotate(-32 41 23)" fill="#ffffff" opacity="0.72"/>
    <!-- Bulb cap -->
    <rect x="41" y="47" width="14" height="5" rx="2.5" fill="#d9e4cc"/>
    <rect x="43" y="52.5" width="10" height="3.2" rx="1.6" fill="#b4c79e"/>

    <!-- Cute twin sprout leaves inside/beside bulb -->
    <path d="M48 39V28" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
    <path d="M48 30c-5.5 0-8-4.5-6-8 4.2-.2 7.2 2.8 6 8z" fill="url(#tc-leaf)"/>
    <path d="M48 30c5.5 0 8-4.5 6-8-4.2-.2-7.2 2.8-6 8z" fill="url(#tc-leaf)"/>

    <!-- Tiny clay sparkles -->
    <path d="M23 26l2 4 4 2-4 2-2 4-2-4-4-2 4-2 2-4z" fill="#ffe97d"/>
    <path d="M74 22l1.6 3.4 3.4 1.6-3.4 1.6-1.6 3.4-1.6-3.4-3.4-1.6 3.4-1.6 1.6-3.4z" fill="#ffe97d"/>
  </g>
</svg>
