<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 96" fill="none">
  <defs>
    <linearGradient id="gw-frame" x1="18" y1="16" x2="202" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7ce68"/>
      <stop offset="52%" stop-color="#d89722"/>
      <stop offset="100%" stop-color="#a56a0e"/>
    </linearGradient>
    <radialGradient id="gw-lens" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="65%" stop-color="#d8f0ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#a5d2ee" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="gw-shadow" x="-10%" y="-15%" width="120%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5c4212" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#gw-shadow)">
    <!-- Side temple tips -->
    <path d="M10 42c5-3 10-3 13 0" stroke="#b97b16" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M197 42c3-3 8-3 13 0" stroke="#b97b16" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Left wide-set translucent lens -->
    <circle cx="54" cy="48" r="30" fill="url(#gw-lens)"/>
    <circle cx="54" cy="48" r="30" stroke="url(#gw-frame)" stroke-width="7"/>
    <!-- Right wide-set translucent lens -->
    <circle cx="166" cy="48" r="30" fill="url(#gw-lens)"/>
    <circle cx="166" cy="48" r="30" stroke="url(#gw-frame)" stroke-width="7"/>
    <!-- Wide arched bridge -->
    <path d="M84 44c12-10 40-10 52 0" stroke="url(#gw-frame)" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Crisp glass specular glints -->
    <path d="M36 33c4-6 11-9 18-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
    <path d="M148 33c4-6 11-9 18-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
  </g>
</svg>
