  <circle cx="112" cy="80" r="11" fill="#2c2419"/>
  <circle cx="64" cy="76" r="3.8" fill="#ffffff"/>
  <circle cx="108" cy="76" r="3.8" fill="#ffffff"/>
  <!-- Round Professor Gold Glasses -->
  <circle cx="68" cy="80" r="19" stroke="url(#goldRim)" stroke-width="4.5" fill="#d9f0ff" fill-opacity=".18"/>
  <circle cx="112" cy="80" r="19" stroke="url(#goldRim)" stroke-width="4.5" fill="#d9f0ff" fill-opacity=".18"/>
