<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" fill="none">
  <defs>
    <linearGradient id="owlBody" x1="36" y1="30" x2="144" y2="174" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c99b6a"/>
      <stop offset="55%" stop-color="#a87948"/>
      <stop offset="100%" stop-color="#845a30"/>
    </linearGradient>
    <linearGradient id="owlBelly" x1="56" y1="88" x2="124" y2="168" gradientUnits="userSpaceOnUse">
