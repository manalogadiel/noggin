    <linearGradient id="goldRim" x1="40" y1="62" x2="140" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe282"/>
      <stop offset="100%" stop-color="#d4931a"/>
    </linearGradient>
  </defs>
  <!-- Cute rounded body -->
  <ellipse cx="90" cy="122" rx="58" ry="60" fill="url(#owlBody)"/>
  <!-- Wings -->
  <ellipse cx="34" cy="128" rx="18" ry="34" transform="rotate(14 34 128)" fill="#94673a"/>
  <ellipse cx="146" cy="128" rx="18" ry="34" transform="rotate(-14 146 128)" fill="#94673a"/>
